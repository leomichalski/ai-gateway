openapi: 3.0.0
info:
  title: Surveil API
  description: Surveillance ingestion and search service.
  version: 0.1.0

paths:
  /healthz:
    get:
      summary: Service Health Check
      description: Returns the operational status of the service and its critical dependencies.
      tags:
        - System
      responses:
        '200':
          description: Service is healthy or operating in a degraded state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
    head:
      summary: Service Health Check
      description: Returns the operational status of the service and its critical dependencies.
      tags:
        - System
      responses:
        '200':
          description: Service is healthy or operating in a degraded state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/v1/chat:
    post:
      summary: Executes a prompt using a LLM/Agent
      operationId: PostApiV1Chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'
        '500':
          description: Internal error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    HealthState:
      type: string
      description: Overall operational state of the service or subsystem.
      enum:
        - ok
        # - degraded
        - down
      example: ok
    HealthResponse:
      type: object
      required:
        - status
      properties:
        status:
          $ref: '#/components/schemas/HealthState'

    ChatRequest:
      type: object
      required:
        - prompt
      properties:
        prompt:
          type: string
        session_id:
          type: string
    ChatResponse:
      type: object
      required:
        - answer
      properties:
        answer:
          type: string
        tokens_used:
          type: integer
          format: int32
        provider:
          type: string
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
